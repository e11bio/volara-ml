name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor and the newest interpreter numba (via volara) supports
        python-version: ["3.12", "3.13"]
        resolution: ["highest", "lowest-direct"]
        exclude:
          # lowest-direct on the newest interpreter: the torch 2.4 floor has no 3.13 wheels
          - python-version: "3.13"
            resolution: lowest-direct
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      # Every uv command in the job resolves the same way. With the mode given to
      # `uv sync` alone, the later `uv run` re-resolved to the newest versions and
      # the lowest-direct leg never tested the declared floors.
      UV_RESOLUTION: ${{ matrix.resolution }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra torch --extra jax
      - name: tests
        run: |
          start=$(date +%s%N)
          uv run pytest --cov-report=xml
          echo "PYTEST_SECONDS=$(awk "BEGIN {print ($(date +%s%N) - $start) / 1e9}")" >> "$GITHUB_ENV"
      # The benchmark workflow publishes these numbers after this run completes.
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.12' && matrix.resolution == 'highest'
        run: uv run python benchmarks/run.py --pytest-seconds "$PYTEST_SECONDS" --pytest-command "uv run pytest --cov-report=xml"
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.12' && matrix.resolution == 'highest'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmarks/output.json
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
