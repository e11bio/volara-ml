[project]
name = "volara-ml"
version = "1.2.0"
description = "Plugin for Volara including ML-related tasks. This includes the `Predict` task and the `models` module."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "volara>=1.0.4",
    "daisy>=1.2.2",
    "gunpowder>=1.5.0",
    "funlib.geometry>=0.3",
    "funlib.persistence>=0.7",
    "pydantic>=2.6.3",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
jax = ["jax>=0.4.30", "flax>=0.8", "orbax-checkpoint>=0.5"]

[project.urls]
Documentation = "https://e11bio.github.io/volara-ml"
Source = "https://github.com/e11bio/volara-ml"
Issues = "https://github.com/e11bio/volara-ml/issues"

[dependency-groups]
# Installed by `uv sync` (PEP 735); not part of the published package.
# ruff and ty versions come from uv.lock; `uv lock --upgrade` moves them.
# The tests need a backend: install it with `uv sync --extra torch` (and/or
# `--extra jax`).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]
docs = [
    "autodoc_pydantic>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-material>=0.0.36",
    "sphinx-click>=6.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=4.0",
    "jupyter-sphinx>=0.5",
    "matplotlib>=3.0",
    "pooch>=1.8",
    "wget>=3.2",
    "funlib-show-neuroglancer>=0.2",
    "nbsphinx>=0.9.7",
    "jupytext>=1.16.7",
]

[project.entry-points."volara.blockwise_tasks"]
predict = "volara_ml.blockwise.predict:Predict"

[tool.ty.src]
include = ["src", "tests", "benchmarks"]
exclude = []  # only ever shrinks

[tool.ty.terminal]
# warn-level rules are recorded counters, not failures
error-on-warning = false

[tool.ty.rules]
# Predict narrows volara's base task fields (fit, read_write_conflict) to
# Literal values; ty reports that as invalid-mutable-override. Recorded as a
# warning to promote once volara types the base fields as the unions.
invalid-mutable-override = "warn"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports

[tool.coverage.run]
branch = true
source = ["volara_ml"]

[tool.coverage.report]
# Floor measured from the first branch-enabled run; raise it when measured
# coverage is two or more points ahead, never lower it without saying why.
fail_under = 43
show_missing = true
skip_covered = true
